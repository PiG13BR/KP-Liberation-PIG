name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-sqflint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SQFLint
        run: pip install sqflint

      - name: Get changed SQF files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: Missionframework/**/*.sqf

      - name: Validate ONLY changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Use a temporary file to store results
          log_file="lint_results.txt"
          failed=false
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Linting: $file"
            # Capture output to a variable
            output=$(sqflint "$file" 2>&1)
            echo "$output"
            
            # Look for the word 'error:' in the output
            if echo "$output" | grep -q ":error:"; then
              echo "!!! ERROR FOUND in $file !!!"
              failed=true
            fi
          done
          
          # Force exit if any error was found
          if [ "$failed" = true ]; then
            echo "Linting failed due to errors."
            exit 1
          fi
