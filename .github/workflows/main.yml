name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-sqflint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed SQF files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: Missionframework/**/*.sqf

      - name: Validate ONLY changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Loop through each file reported as changed
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Linting: $file"
            # We run the linter directly via Docker to avoid the 'multiple arguments' bug
            docker run --rm -v $(pwd):/data -w /data lordmarmit/sqflint:latest "$file" --exit w
          done
